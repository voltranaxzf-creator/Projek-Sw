<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xdnry777 — Akun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #050714 0%, #101b35 50%, #0a1629 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .bg-blob-1, .bg-blob-2 {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
        }
        .bg-blob-1 {
            width: 500px;
            height: 500px;
            background: #1e5aeb;
            top: -150px;
            right: -100px;
        }
        .bg-blob-2 {
            width: 400px;
            height: 400px;
            background: #0f38a0;
            bottom: -100px;
            left: -100px;
        }
        .card {
            position: relative;
            z-index: 1;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(59, 130, 246, 0.18);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 30px;
        }
        .tab-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: 1px solid rgba(59, 130, 246, 0.15);
            color: #94a3b8;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        .tab.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
            color: #fff;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            color: #93c5fd;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #3b82f6;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            margin-top: 10px;
        }
        .btn-secondary:hover {
            background: rgba(59, 130, 246, 0.25);
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            display: none;
        }
        .message.show {
            display: block;
        }
        .message.error {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }
        .message.success {
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>

    <div class="card">
        <div class="logo">Xdnry777</div>

        <div class="tab-group">
            <button class="tab active" id="tabLogin">Masuk</button>
            <button class="tab" id="tabRegister">Daftar</button>
        </div>

        <!-- Form Login -->
        <form id="loginForm">
            <div class="form-group">
                <label>Nama Pengguna</label>
                <input type="text" id="loginUser" required>
            </div>
            <div class="form-group">
                <label>Kata Sandi</label>
                <input type="password" id="loginPass" required>
            </div>
            <button type="submit" class="btn btn-primary">Masuk</button>
            <button type="button" class="btn btn-secondary" onclick="window.close()">Kembali</button>
            <div id="loginMsg" class="message"></div>
        </form>

        <!-- Form Daftar -->
        <form id="registerForm" class="hidden">
            <div class="form-group">
                <label>Nama Pengguna</label>
                <input type="text" id="regUser" required>
            </div>
            <div class="form-group">
                <label>Kata Sandi</label>
                <input type="password" id="regPass" required>
            </div>
            <div class="form-group">
                <label>Ulangi Kata Sandi</label>
                <input type="password" id="regPass2" required>
            </div>
            <button type="submit" class="btn btn-primary">Buat Akun</button>
            <button type="button" class="btn btn-secondary" onclick="switchTab('login')">Sudah Punya Akun?</button>
            <div id="regMsg" class="message"></div>
        </form>
    </div>

    <script>
        const STORAGE_KEY = 'xdnry777_user';

        function switchTab(tab) {
            if (tab === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('tabRegister').classList.remove('active');
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('registerForm').classList.add('hidden');
            } else {
                document.getElementById('tabLogin').classList.remove('active');
                document.getElementById('tabRegister').classList.add('active');
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
            }
        }

        document.getElementById('tabLogin').addEventListener('click', () => switchTab('login'));
        document.getElementById('tabRegister').addEventListener('click', () => switchTab('register'));

        // Login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value;
            const msgBox = document.getElementById('loginMsg');

            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) {
                msgBox.textContent = 'Akun tidak ditemukan. Silakan daftar dulu.';
                msgBox.className = 'message error show';
                return;
            }
            const data = JSON.parse(saved);
            if (data.username === user && data.password === pass) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({...data, loggedIn: true}));
                msgBox.textContent = 'Berhasil masuk! Menutup halaman...';
                msgBox.className = 'message success show';
                setTimeout(() => {
                    if (window.opener) window.opener.location.reload();
                    window.close();
                }, 800);
            } else {
                msgBox.textContent = 'Nama pengguna atau kata sandi salah.';
                msgBox.className = 'message error show';
            }
        });

        // Daftar
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('regUser').value.trim();
            const pass = document.getElementById('regPass').value;
            const pass2 = document.getElementById('regPass2').value;
            const msgBox = document.getElementById('regMsg');

            if (user.length < 3) {
                msgBox.textContent = 'Nama pengguna minimal 3 karakter.';
                msgBox.className = 'message error show';
                return;
            }
            if (pass.length < 4) {
                msgBox.textContent = 'Kata sandi minimal 4 karakter.';
                msgBox.className = 'message error show';
                return;
            }
            if (pass !== pass2) {
                msgBox.textContent = 'Kata sandi tidak cocok.';
                msgBox.className = 'message error show';
                return;
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                username: user,
                password: pass,
                loggedIn: true
            }));
            msgBox.textContent = 'Akun berhasil dibuat! Masuk ke halaman utama...';
            msgBox.className = 'message success show';
            setTimeout(() => {
                if (window.opener) window.opener.location.reload();
                window.close();
            }, 800);
        });
    </script>
</body>
</html>
