<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PureStatus — Pusat Akun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #050714 0%, #101b35 50%, #0a1629 100%);
            color: #fff;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .bg-blob-1, .bg-blob-2 {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
        }
        .bg-blob-1 {
            width: 500px;
            height: 500px;
            background: #1e5aeb;
            top: -150px;
            right: -100px;
        }
        .bg-blob-2 {
            width: 400px;
            height: 400px;
            background: #0f38a0;
            bottom: -100px;
            left: -100px;
        }

        .glass {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(59, 130, 246, 0.18);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
        }

        .logo {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
        }
        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            color: #7c94b8;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }
        .auth-tab.active {
            color: #60a5fa;
            border-bottom-color: #3b82f6;
        }

        .auth-form {
            display: none;
        }
        .auth-form.active {
            display: block;
        }

        .auth-form h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #e0efff;
            font-size: 1.3rem;
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 10px;
            padding: 14px 16px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #3b82f6;
        }

        .btn {
            padding: 14px 36px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(37, 99, 235, 0.4);
        }
        .btn-secondary {
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.25);
        }
        .btn-secondary:hover {
            background: rgba(59, 130, 246, 0.25);
        }
        .btn-full {
            width: 100%;
            margin-top: 8px;
        }

        .message-box {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            display: none;
        }
        .message-box.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        .message-box.success {
            display: block;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
        }

        .status-box {
            text-align: center;
            padding: 20px;
            display: none;
        }
        .status-box.active {
            display: block;
        }
        .status-box h3 {
            color: #e0efff;
            margin-bottom: 8px;
        }
        .status-box p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
        }
        .back-link a {
            color: #60a5fa;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>

    <div class="container">
        <div class="glass" style="padding: 36px;">
            <div class="logo">✨ Pusat Akun PureStatus</div>
            <p class="subtitle">Kelola akun Anda untuk mengakses semua layanan PureStatus</p>

            <!-- Tabs -->
            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login">Masuk</div>
                <div class="auth-tab" data-tab="register">Daftar</div>
            </div>

            <!-- Form Login -->
            <form class="auth-form active" id="loginForm">
                <h2>Masuk ke Akun Anda</h2>
                <div class="message-box" id="loginMsg"></div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUser" required placeholder="Masukkan username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPass" required placeholder="Masukkan password">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Masuk</button>
            </form>

            <!-- Form Daftar -->
            <form class="auth-form" id="registerForm">
                <h2>Buat Akun Baru</h2>
                <div class="message-box" id="regMsg"></div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="regUser" required placeholder="Pilih username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPass" required placeholder="Min. 6 karakter">
                </div>
                <div class="form-group">
                    <label>Ulangi Password</label>
                    <input type="password" id="regPass2" required placeholder="Ketik ulang password">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Daftar Sekarang</button>
            </form>

            <!-- Status Berhasil -->
            <div class="status-box" id="successBox">
                <h3 id="successTitle">✅ Berhasil!</h3>
                <p id="successText">Sedang dialihkan kembali...</p>
                <button class="btn btn-secondary" onclick="closeWindow()">Tutup Halaman Ini</button>
            </div>

            <div class="back-link">
                <a href="javascript:history.back()">← Kembali ke Halaman Utama</a>
            </div>
        </div>
    </div>

    <script>
        // === KONFIGURASI PENYIMPANAN DATA ===
        const STORAGE_KEY = 'purestatus_accounts';
        const SESSION_KEY = 'purestatus_session';

        // Ambil semua akun yang tersimpan
        function getAllAccounts() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        // Simpan akun baru
        function saveAccount(username, password) {
            const accounts = getAllAccounts();
            
            // Cek username sudah ada
            if (accounts.find(a => a.username.toLowerCase() === username.toLowerCase())) {
                return { success: false, message: 'Username sudah digunakan!' };
            }

            accounts.push({
                username: username,
                password: password,
                createdAt: new Date().toISOString()
            });

            localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts));
            return { success: true, message: 'Pendaftaran berhasil!' };
        }

        // Cek login
        function verifyLogin(username, password) {
            const accounts = getAllAccounts();
            const account = accounts.find(a => 
                a.username.toLowerCase() === username.toLowerCase() && 
                a.password === password
            );
            
            if (account) {
                // Simpan sesi login
                const sessionData = {
                    username: account.username,
                    loggedInAt: new Date().toISOString()
                };
                localStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
                return { success: true, username: account.username };
            }
            return { success: false, message: 'Username atau password salah!' };
        }

        // Tutup jendela dan beri tahu halaman utama
        function closeWindow() {
            // Kirim pesan ke halaman induk kalau login berhasil
            if (window.opener) {
                window.opener.postMessage({ 
                    type: 'authSuccess',
                    username: localStorage.getItem(SESSION_KEY) 
                        ? JSON.parse(localStorage.getItem(SESSION_KEY)).username 
                        : null
                }, '*');
            }
            window.close();
        }

        // === TAB SWITCH ===
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                
                tab.classList.add('active');
                const targetForm = tab.dataset.tab === 'login' ? 'loginForm' : 'registerForm';
                document.getElementById(targetForm).classList.add('active');
                
                // Sembunyikan kotak pesan
                document.querySelectorAll('.message-box').forEach(m => m.style.display = 'none');
                document.getElementById('successBox').classList.remove('active');
            });
        });

        // === FORM DAFTAR ===
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('regUser').value.trim();
            const password = document.getElementById('regPass').value;
            const password2 = document.getElementById('regPass2').value;
            const msgBox = document.getElementById('regMsg');

            msgBox.classList.remove('error', 'success');
            
            if (username.length < 3) {
                msgBox.textContent = 'Username minimal 3 karakter!';
                msgBox.classList.add('error');
                return;
            }
            if (password.length < 6) {
                msgBox.textContent = 'Password minimal 6 karakter!';
                msgBox.classList.add('error');
                return;
            }
            if (password !== password2) {
                msgBox.textContent = 'Password tidak cocok!';
                msgBox.classList.add('error');
                return;
            }

            const result = saveAccount(username, password);
            if (result.success) {
                msgBox.classList.add('success');
                msgBox.textContent = result.message;
                setTimeout(() => {
                    // Otomatis pindah ke tab login setelah daftar
                    document.querySelector('[data-tab="login"]').click();
                    document.getElementById('loginMsg').classList.add('success');
                    document.getElementById('loginMsg').textContent = 'Akun berhasil dibuat! Silakan masuk.';
                }, 1200);
            } else {
                msgBox.classList.add('error');
                msgBox.textContent = result.message;
            }
        });

        // === FORM LOGIN ===
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('loginUser').value.trim();
            const password = document.getElementById('loginPass').value;
            const msgBox = document.getElementById('loginMsg');

            msgBox.classList.remove('error', 'success');
            
            const result = verifyLogin(username, password);
            if (result.success) {
                // Tampilkan kotak sukses
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('successBox').classList.add('active');
                document.getElementById('successTitle').textContent = `✅ Selamat Datang, ${result.username}!`;
                document.getElementById('successText').textContent = 'Berhasil masuk ke akun PureStatus';
