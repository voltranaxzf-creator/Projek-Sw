<!DOCTYPE html>
<html lang="id">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xdnry777 — HD Status & Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #050714 0%, #101b35 50%, #0a1629 100%);
            color: #fff;
            position: relative;
        }
        .bg-blob-1, .bg-blob-2 {

            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
        }
        .bg-blob-1 {
            width: 500px;
            height: 500px;
            background: #1e5aeb;
            top: -150px;
            right: -100px;
        }
        .bg-blob-2 {
            width: 400px;
            height: 400px;
            background: #0f38a0;
            bottom: -100px;
            left: -100px;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header {

            z-index: 10;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-info {
            display: none;
            align-items: center;
            gap: 12px;
            color: #93c5fd;
            font-size: 0.9rem;
        }
        .user-info.show {
            display: flex;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.25);
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 0.85rem;
        }
        .container {

            z-index: 10;

            margin: 0 auto;
            padding: 20px 5%;
        }
        .hero {
            text-align: center;
            padding: 30px 20px;
        }
        .hero h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            color: #94a3b8;
        }
        .auth-modal {

            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            display: none;
        }
        .auth-modal.show {
            display: flex;
        }
        .auth-card {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 380px;
        }
        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .auth-tab {
            flex: 1;
            padding: 8px;
            background: transparent;
            border: 1px solid rgba(59, 130, 246, 0.15);
            color: #94a3b8;
            border-radius: 6px;
            cursor: pointer;
        }
        .auth-tab.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
            color: #fff;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            color: #93c5fd;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus {
            border-color: #3b82f6;
        }
        .hidden {
            display: none !important;
        }
        .locked-content {
            position: relative;
        }
        .locked-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;

            z-index: 10;

            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(59, 130, 246, 0.18);
            border-radius: 16px;
        }
        .upload-area {

            border-radius: 12px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.05);
        }
        .input-field {
            width: 100%;
            padding: 12px 16px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }
        .tabs-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .tab-btn {
            padding: 10px 20px;
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.15);
            color: #94a3b8;
            border-radius: 8px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
            color: #fff;
        }
        .tab-pane {
            display: none;
        }
        .tab-pane.active {
            display: block;
        }
        .message {
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            display: none;
        }
        .message.show {
            display: block;
        }
        .message.error {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }
        .message.success {
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
        }
    </style>
</head>

    <script>
        const KUNCI_STORAGE = 'xdnry777_akun';

        // Cek status login
        function periksaLogin() {
            const data = JSON.parse(localStorage.getItem(KUNCI_STORAGE) || '{}');
            if (data.sudahMasuk) {
                document.getElementById('infoPengguna').classList.add('show');
                document.getElementById('btnBukaAuth').style.display = 'none';
                document.getElementById('namaPengguna').textContent = data.nama;
                document.getElementById('overlayKunci').classList.add('hidden');
            } else {
                document.getElementById('infoPengguna').classList.remove('show');
                document.getElementById('btnBukaAuth').style.display = 'block';
                document.getElementById('overlayKunci').classList.remove('hidden');
            }
        }

        // Buka/tutup modal

        }
        function tutupModalAuth() {
            document.getElementById('authModal').classList.remove('show');
        }
        function resetFormAuth() {
            document.getElementById('formLogin').classList.remove('hidden');

            document.getElementById('msgLogin').classList.remove('show');
            document.getElementById('msgReg').classList.remove('show');
            document.getElementById('formLogin').reset();
            document.getElementById('formReg').reset();
        }

        // Ganti tab Login/Daftar
        document.getElementById('tabLogin').addEventListener('click', function() {
            this.classList.add('active');
            document.getElementById('tabReg').classList.remove('active');
            document.getElementById('formLogin').classList.remove('hidden');
            document.getElementById('formReg').classList.add('hidden');
        });

            this.classList.add('active');

            document.getElementById('formReg').classList.remove('hidden');
            document.getElementById('formLogin').classList.add('hidden');
        });
