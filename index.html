<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xdnry777 — HD Status & Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #050714 0%, #101b35 50%, #0a1629 100%);
            color: #fff;
            position: relative;
        }
        .bg-blob-1, .bg-blob-2 {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
        }
        .bg-blob-1 {
            width: 500px;
            height: 500px;
            background: #1e5aeb;
            top: -150px;
            right: -100px;
        }
        .bg-blob-2 {
            width: 400px;
            height: 400px;
            background: #0f38a0;
            bottom: -100px;
            left: -100px;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header {
            position: relative;
            z-index: 10;
            padding: 20px 5%;
            display: flex;
            justify-content: center;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
        }
        .container {
            position: relative;
            z-index: 10;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 5%;
        }
        .hero {
            text-align: center;
            padding: 30px 20px;
        }
        .hero h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            color: #94a3b8;
        }
        .section-box {
            padding: 30px;
            text-align: center;
            margin-bottom: 25px;
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(59, 130, 246, 0.18);
            border-radius: 16px;
        }
        .upload-area {
            border: 2px dashed rgba(59, 130, 246, 0.4);
            border-radius: 12px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.05);
        }
        .input-field {
            width: 100%;
            padding: 12px 16px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            margin-bottom: 15px;
            outline: none;
        }
        .tabs-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .tab-btn {
            padding: 10px 20px;
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.15);
            color: #94a3b8;
            border-radius: 8px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
            color: #fff;
        }
        .tab-pane {
            display: none;
        }
        .tab-pane.active {
            display: block;
        }
        .message {
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            display: none;
        }
        .message.show {
            display: block;
        }
        .message.info {
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
        }
        .hidden {
            display: none !important;
        }
        #previewArea {
            margin-top: 20px;
        }
        #previewArea img, #previewArea video {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="bg-blob-1"></div>
    <div class="bg-blob-2"></div>

    <header>
        <div class="logo">Xdnry777</div>
    </header>

    <div class="container">
        <section class="hero">
            <h1>HD Status & Downloader Sosmed</h1>
            <p>Kompres foto & video tanpa hilang kualitas, unduh video TikTok & Instagram</p>
        </section>

        <div class="tabs-nav">
            <button type="button" class="tab-btn active" data-tab="kompres">Kompres Status</button>
            <button type="button" class="tab-btn" data-tab="download">Download Media</button>
        </div>

        <!-- TAB KOMPRES -->
        <div class="tab-pane active" id="kompres">
            <div class="section-box">
                <h3 style="margin-bottom:15px;">Unggah Foto atau Video</h3>
                <div class="upload-area" id="kotakUnggah">
                    <p>Klik di sini atau seret file ke kotak ini</p>
                    <input type="file" id="inputFile" accept="image/*,video/*" style="display:none;">
                </div>
                <p style="color:#94a3b8; margin-top:10px; font-size:0.9rem;">Format: JPG, PNG, MP4, MOV</p>
                
                <div id="previewArea" class="hidden">
                    <h4 style="margin:15px 0 5px;">Pratinjau:</h4>
                    <div id="previewContent"></div>
                    <button type="button" class="btn btn-primary" id="btnDownloadFile" style="margin-top:15px;">Simpan File</button>
                </div>
            </div>
        </div>

        <!-- TAB DOWNLOAD -->
        <div class="tab-pane" id="download">
            <div class="section-box">
                <h3 style="margin-bottom:15px;">Download Video & Foto</h3>
                <input type="text" class="input-field" id="inputLink" placeholder="Tempel tautan TikTok / Instagram di sini...">
                <button type="button" class="btn btn-primary" id="btnDapatkan">Dapatkan Tautan</button>
                <div id="msgDownload" class="message info">💡 Masukkan tautan lalu klik tombol di atas</div>
            </div>
        </div>
    </div>

    <script>
        // Ganti Tab
        const tabButtons = document.querySelectorAll('.tab-btn');
        tabButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                tabButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const tabId = this.getAttribute('data-tab');
                document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
                document.getElementById(tabId).classList.add('active');
            });
        });

        // Upload & Preview File
        const kotakUnggah = document.getElementById('kotakUnggah');
        const inputFile = document.getElementById('inputFile');
        const previewArea = document.getElementById('previewArea');
        const previewContent = document.getElementById('previewContent');
        const btnDownloadFile = document.getElementById('btnDownloadFile');
        let fileSaatIni = null;

        kotakUnggah.addEventListener('click', () => inputFile.click());

        inputFile.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            fileSaatIni = file;
            previewContent.innerHTML = '';
            
            if (file.type.startsWith('image/')) {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                previewContent.appendChild(img);
            } else if (file.type.startsWith('video/')) {
                const video = document.createElement('video');
                video.src = URL.createObjectURL(file);
                video.controls = true;
                previewContent.appendChild(video);
            }
            
            previewArea.classList.remove('hidden');
        });

        btnDownloadFile.addEventListener('click', function() {
            if (!fileSaatIni) return;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(fileSaatIni);
            a.download = fileSaatIni.name;
            a.click();
        });

        // Download Sosmed
        const btnDapatkan = document.getElementById('btnDapatkan');
        const inputLink = document.getElementById('inputLink');
        const msgDownload = document.getElementById('msgDownload');

        btnDapatkan.addEventListener('click', function() {
            const link = inputLink.value.trim();
            if (!link) {
                msgDownload.textContent = '⚠️ Silakan masukkan tautan terlebih dahulu!';
                msgDownload.classList.add('show');
                return;
            }
            msgDownload.innerHTML = '✅ Tautan diterima.<br>⚠️ Fitur unduh langsung membutuhkan server khusus. Gunakan layanan seperti snaptik.app untuk TikTok atau inflact.com untuk Instagram.<br>🔗 Tautan kamu: <a href="'+link+'" target="_blank" style="color:#60a5fa; word-break:break-all;">'+link+'</a>';
            msgDownload.classList.add('show');
        });
    </script>
</body>
</html>
